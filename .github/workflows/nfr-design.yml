name: NFR design harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    env:
      NFR_SKILL: plugins/toshipon-mode/skills/nfr-design
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r "$NFR_SKILL/requirements-dev.txt"
      - run: python -m compileall -q "$NFR_SKILL/runtime" "$NFR_SKILL/scripts"
      - run: ruff check "$NFR_SKILL"
      - run: ruff format --check "$NFR_SKILL"
      - run: pyright --pythonpath "$(command -v python)"
        working-directory: plugins/toshipon-mode/skills/nfr-design
      - run: python -m coverage run --source="$NFR_SKILL/runtime/harness" -m unittest discover -s "$NFR_SKILL/tests" -v
      - run: python -m coverage report --fail-under=80

  legacy-loop:
    # This suite explicitly targets the /bin/bash 3.2 used by launchd on macOS.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: /bin/bash plugins/toshipon-mode/skills/loop-engineering/scripts/loop-selftest.sh
