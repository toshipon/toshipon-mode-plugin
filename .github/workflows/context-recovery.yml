name: Context recovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.13']
        skill: [project-context-explorer, review-context-recovery]
        include:
          # File modes and temporary paths differ by platform, so both suites also run on macOS.
          - os: macos-latest
            python: '3.13'
            skill: project-context-explorer
          - os: macos-latest
            python: '3.13'
            skill: review-context-recovery
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SKILL: plugins/toshipon-mode/skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r "$SKILL/requirements-dev.txt"
      - run: python -m compileall -q "$SKILL/runtime" "$SKILL/scripts"
      - run: ruff check "$SKILL"
      - run: ruff format --check "$SKILL"
      - run: pyright --pythonpath "$(command -v python)"
        working-directory: plugins/toshipon-mode/skills/${{ matrix.skill }}
      - run: python -m coverage run --source="$SKILL/runtime" -m unittest discover -s "$SKILL/tests" -v
      - run: python -m coverage report --fail-under=90
