name: Insight discovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.13']
        include:
          # Path refusals and file modes differ by platform, so the adapters also run on macOS.
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SKILL: plugins/toshipon-mode/skills/insight-discovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r "$SKILL/requirements-dev.txt"
      - run: python -m compileall -q "$SKILL/runtime" "$SKILL/scripts" "$SKILL/examples"
      - run: ruff check "$SKILL"
      - run: ruff format --check "$SKILL"
      - run: pyright --pythonpath "$(command -v python)"
        working-directory: plugins/toshipon-mode/skills/insight-discovery
      - run: python -m coverage run --source="$SKILL/runtime/insight_discovery" -m unittest discover -s "$SKILL/tests" -v
      - run: python -m coverage report --fail-under=85
