name: SRE harness

on:
  pull_request:
    paths:
      - plugins/sre-harness/**
      - .claude-plugin/marketplace.json
      - .github/workflows/sre-harness.yml
  push:
    branches: [main]
    paths:
      - plugins/sre-harness/**
      - .claude-plugin/marketplace.json
      - .github/workflows/sre-harness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: plugins/sre-harness/runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q sre_harness
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)"
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
