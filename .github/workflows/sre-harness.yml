name: SRE harness

on:
  pull_request:
    paths:
      - plugins/sre-harness/**
      - .claude-plugin/marketplace.json
      - .github/workflows/sre-harness.yml
  push:
    branches: [main]
    paths:
      - plugins/sre-harness/**
      - .claude-plugin/marketplace.json
      - .github/workflows/sre-harness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: plugins/sre-harness/runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q sre_harness
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)"
      # opa for the IaC risk sample: a pinned official release, checked against the sha256
      # published with it (opa_linux_amd64_static.sha256), before it is put on PATH.
      - name: Install opa (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        env:
          OPA_VERSION: v1.22.2
          OPA_SHA256: 24e344d1fc394cd93dc75666f584cfb97c6981f7255af25f8d2979834317317b
        run: |
          curl -sSLf -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          mkdir -p opa-bin && install -m 0755 opa opa-bin/opa
          echo "${RUNNER_TEMP}/opa-bin" >> "$GITHUB_PATH"
      - run: python -m coverage run -m pytest
        env:
          SRE_HARNESS_REQUIRE_OPA: '1'
      - run: python -m coverage report
