[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ai_harness"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["runtime", "scripts", "examples"]
extraPaths = ["runtime"]
