[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sre_harness"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["sre_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["sre_harness"]

[tool.coverage.report]
fail_under = 85
